# ════════════════════════════════════════════════════════════════════════
# Configuración del pipeline de churn/attrition
#
# Para pasar de datos sintéticos a datos reales: cambiar data.source a
# "drive" y verificar que data.files apunte a los nombres de tus archivos.
# Nada más en el pipeline necesita cambiar.
# ════════════════════════════════════════════════════════════════════════

data:
  # synthetic = genera datos simulados en memoria (para probar el pipeline)
  # drive     = lee los extractos del agente SQL desde Google Drive
  source: synthetic

  # Carpeta en Drive con los CSV/parquet del agente SQL.
  # En Colab, Drive se monta en /content/drive/MyDrive/
  drive_dir: "/content/drive/MyDrive/churn_model/data/raw"

  # Dónde guardar panel y features ya construidos (para no recalcular)
  processed_dir: "/content/drive/MyDrive/churn_model/data/processed"

  # Dónde guardar modelos, métricas y gráficos
  artifacts_dir: "/content/drive/MyDrive/churn_model/artifacts"

  file_format: csv          # csv | parquet

  # Nombre de archivo (sin extensión) por cada una de las 7 queries.
  # Ajustar si tu agente SQL los nombra distinto.
  files:
    party:         "q1_party_master"
    relationships: "q2_cif_account_relationship"
    deposits:      "q3_deposit_monthly"
    loans:         "q4_loan_monthly"
    transactions:  "q5_txn_monthly"
    digital:       "q6_digital_contact_monthly"
    events:        "q7_product_events"

  # Tablas que el pipeline puede tolerar si no existen todavía.
  # Permite empezar a modelar con Q1-Q3 mientras llegan las demás.
  optional: [loans, transactions, digital, events]


# ── Estructura del panel temporal ───────────────────────────────────────
#
# Aritmética a tener presente: el panel utilizable pierde
#   min_history_months  (por detrás, para poder calcular features)
# + gap_months + performance_window_months  (por delante, para etiquetar)
# y el embargo del split OOT cuesta otros (gap + performance) meses.
# Con 36 meses de historia y los valores de abajo quedan ~20 meses de train.
panel:
  history_months: 36            # cuántos meses de snapshots generar
  feature_window_months: 12     # ventana de historia para features
  min_history_months: 6         # historia mínima exigida (< feature_window:
                                # los rolling usan min_periods)
  gap_months: 1                 # latencia: hace el modelo accionable
  performance_window_months: 6  # horizonte de predicción
  min_tenure_months: 6          # excluir clientes demasiado nuevos


# ── Definición del target ───────────────────────────────────────────────
target:
  low_balance_abs: 100.0            # saldo bajo absoluto (USD)
  low_balance_pct_of_baseline: 0.05 # o 5% de su propio promedio 12m
  inactivity_days: 90               # sin transacciones del cliente
  persistence_months: 2             # meses consecutivos para confirmar
  exclude_involuntary: true
  involuntary_reason_codes:
    - DECEASED
    - AML_EXIT
    - FRAUD
    - CHARGE_OFF
    - BANK_INITIATED
    - ESCHEAT


# ── Pesos de ownership por rol del CIF ──────────────────────────────────
# null = repartir 1/n_owners entre los titulares
ownership_weights:
  primary:           1.0
  sole:              1.0
  joint:             null
  custodian:         1.0
  trustee:           1.0
  authorized_signer: 0.0
  beneficiary:       0.0
  borrower:          1.0
  co_borrower:       null
  guarantor:         0.0

# Roles que hacen a un CIF elegible para la población de modelado
eligible_roles: [primary, sole, joint, custodian, trustee, borrower, co_borrower]


# ── Split y validación ──────────────────────────────────────────────────
split:
  oot_months: 6        # últimos N meses reservados como holdout out-of-time
  embargo: true        # excluir del train las filas cuya ventana de etiqueta
                       # invade el periodo de test. Desactivarlo infla las
                       # métricas; solo hazlo si el panel es muy corto.
  n_folds: 5           # folds de StratifiedGroupKFold (agrupado por CIF)
  random_state: 42


# ── Modelos ─────────────────────────────────────────────────────────────
models:
  enabled: [logreg, random_forest, lightgbm, xgboost, catboost]
  n_iter: 20                    # iteraciones de RandomizedSearchCV
  scoring: average_precision    # PR-AUC, no accuracy ni ROC-AUC
  n_jobs: -1
  calibrate: true               # calibración isotónica sobre el holdout
  stack_top_k: 3                # cuántos modelos entran al stacking

  # Red secuencial sobre las series mensuales (GRU).
  # Aporta sobre todo cuando hay >12 meses de historia por cliente.
  sequence_model:
    enabled: true
    hidden_size: 64
    num_layers: 1
    dropout: 0.2
    epochs: 30
    batch_size: 256
    lr: 0.001
    patience: 5


# ── Explicabilidad ──────────────────────────────────────────────────────
explain:
  shap_sample_size: 2000
  top_n_features: 25
  counterfactual_features:      # features accionables por retención
    - has_direct_deposit
    - digital_login_count_3m_avg
    - n_products_owned
    - bill_pay_payees_active
    - fees_charged_6m_sum


# ── Generador sintético (solo si data.source == synthetic) ──────────────
synthetic:
  n_customers: 4000
  n_months: 36
  start_month: "2022-07-01"
  # Tasa de *intención* de fuga. La tasa finalmente detectada por el target
  # compuesto es menor (~la mitad): los clientes que quedan anclados como
  # co-titulares en la cuenta de otro nunca llegan a cumplir la definición.
  # Eso no es un defecto del simulador — pasa igual en un banco real, y es
  # justamente por lo que el target se define sobre comportamiento observado
  # y no sobre intención.
  annual_churn_rate: 0.18
  seed: 42
